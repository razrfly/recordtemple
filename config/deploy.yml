service: recordtemple
image: razrfly/recordtemple

servers:
  web:
    - 192.168.1.205
  worker:
    hosts:
      - 192.168.1.205
    cmd: bundle exec sidekiq -C config/sidekiq.yml

proxy:
  ssl: true
  host: recordtemple.com
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3

registry:
  server: ghcr.io
  username: razrfly
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: arm64

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "true"
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - REDIS_URL

ssh:
  user: holden

asset_path: /app/public/assets

accessories:
  redis:
    image: redis:7-alpine
    host: 192.168.1.205
    port: "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

aliases:
  shell: app exec --interactive --reuse "bash"
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs
